<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="App de clima para portifolio construida com HTML, CSS e JavaScript.">
  <title>Clima Agora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero__copy">
        <p class="eyebrow">Portifolio Frontend</p>
        <h1>Clima Agora</h1>
        <p class="hero__text">
          Um MVP simples para consultar temperatura, umidade, condicao do tempo e previsao de 5 dias.
        </p>
      </div>

      <div class="search-area">
        <form class="search-panel" id="weather-form">
          <label class="sr-only" for="city-input">Cidade</label>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="Digite uma cidade, ex: Sao Paulo"
            autocomplete="off"
            minlength="2"
            required
            aria-describedby="search-status"
          >
          <button id="search-button" type="submit">Buscar clima</button>
        </form>
        <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
      </div>
    </header>

    <main class="dashboard">
      <section class="current-weather card">
        <div>
          <p class="section-label">Clima atual</p>
          <h2 id="location-name">Rio de Janeiro</h2>
          <p id="weather-description" class="weather-description">Carregando dados reais...</p>
        </div>

        <div class="temperature-block">
          <span id="temperature-value">--</span>
          <small>&deg;C</small>
        </div>

        <div class="current-meta">
          <article class="mini-card">
            <span>Umidade</span>
            <strong id="humidity-value">--%</strong>
          </article>
        </div>
      </section>

      <section class="forecast card">
        <div class="section-head">
          <div>
            <p class="section-label">Previsao</p>
            <h2>Proximos dias</h2>
          </div>
          <p class="section-note">Dados atualizados pela API Open-Meteo.</p>
        </div>

        <div class="forecast-list" id="forecast-list" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
